[project]
name = "alx-zoning-illegal-homes"
version = "0.1.0"
description = ""
authors = [{ name = "Tom VanAntwerp", email = "tom@tomvanantwerp.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "geopandas>=0.13.2,<0.14",
    "requests>=2.31.0,<3",
]

[project.urls]
Repository = "https://github.com/tvanantwerp/alx-zoning-illegal-homes"

[project.scripts]
create-map = "alx_zoning_illegal_homes.mapper.main:main"

[dependency-groups]
dev = ["pylint>=2.17.5,<3"]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
