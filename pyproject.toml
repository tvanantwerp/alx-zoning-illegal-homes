[project]
name = "alx-zoning-illegal-homes"
version = "0.1.0"
description = ""
authors = [{ name = "Tom VanAntwerp", email = "tom@tomvanantwerp.com" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "geopandas>=1.2.0",
    "pyogrio>=0.13.0",
    "requests>=2.34.2",
    "shapely>=2.2.0",
]

[project.urls]
Repository = "https://github.com/tvanantwerp/alx-zoning-illegal-homes"

[project.scripts]
create-map = "alx_zoning_illegal_homes.mapper.main:main"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.2.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
